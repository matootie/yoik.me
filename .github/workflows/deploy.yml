name: Deploy

on:
  push:
    branches: [trunk]

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.8"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check (client)
        run: cd services/client && bunx tsc --noEmit

      - name: Type check (api)
        run: cd services/api && bunx tsc --noEmit

      - name: Run tests
        run: bunx turbo run test

      - name: Format check
        run: bunx prettier --check --config config/.prettierrc.json "**/*.{ts,tsx,json,md}"

  deploy:
    name: Deploy to Firebase
    needs: lint-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.8"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build client
        run: cd services/client && bunx vite build

      - name: Bundle Cloud Functions
        run: cd functions && node build.mjs

      - name: Install functions production dependencies
        run: |
          # Copy functions dir outside the monorepo so npm doesn't
          # walk up and encounter workspace:* protocol references.
          cp -r functions /tmp/functions-stage
          cd /tmp/functions-stage
          npm install --omit=dev
          # Copy the resolved node_modules back
          rm -rf $GITHUB_WORKSPACE/functions/node_modules
          cp -r node_modules $GITHUB_WORKSPACE/functions/node_modules

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy to Firebase
        run: bunx firebase-tools deploy --force --project yoikme
